[Models]
# LLM Configuration
# IMPORTANT: This must match the model seeded in your GKE backend (Step 1.3)
# Options: gemma2:2b (recommended for cost), llama3, etc.
ollama_model = gemma2:2b

# Cloud Ollama Backend Configuration
# Points to your KEDA HTTP Add-on interceptor proxy
# The bridge script (bridge/connect-assistant.sh) will update this automatically
ollama_host = http://ollama.gke.dev

# HTTP Timeout for Ollama API calls
# Set to 240 seconds (4 minutes) to accommodate KEDA cold-start provisioning (2-4 min)
# This gives the GKE cluster time to provision a Spot node and start the pod
ollama_timeout = 240

# Local Speech Models (ONNX-based, runs on your machine)
# STT Model Size: tiny, base, small, medium, large (larger = more accurate but slower)
stt_model = base

# TTS Model (Text-to-Speech)
tts_model = tts_models/en/ljspeech/glow-tts

[Audio]
# Audio Device Configuration
# Run 'python list_audio_devices.py' to find your device IDs
# Common defaults: 0 (primary device), but may vary on multi-device systems

# Microphone input device ID
input_device = 0

# Speaker output device ID
output_device = 0

# Audio chunk size for streaming (in samples)
chunk_size = 1024

# Sample rate for audio processing (Hz)
sample_rate = 16000

[Timeouts]
# HTTP Request Timeout (seconds)
# Increased to account for cloud latency + cold-start provisioning
# First request of the day may hit 2-4 min cold start, subsequent < 1 sec
http_request_timeout = 240

# Speech Recognition Timeout (seconds)
# Max duration to listen for voice input before timing out
speech_recognition_timeout = 30

# Speech Synthesis Timeout (seconds)
# Max duration to wait for TTS response
synthesis_timeout = 30

[Logging]
# Logging Configuration
# DEBUG: Verbose logging (for troubleshooting)
# INFO: Standard logging (recommended for production)
# WARNING: Only warnings and errors
log_level = INFO

# Log file path (relative to frontend directory)
log_file = assistant.log

# Whether to also print logs to console
console_output = true

[Performance]
# Enable audio preprocessing (noise reduction)
enable_audio_preprocessing = true

# Noise reduction sensitivity (0.0 - 1.0)
# 0.0 = no noise reduction, 1.0 = aggressive
noise_threshold = 0.1

# Enable Voice Activity Detection (VAD) to skip silence
enable_vad = true

# Response generation temperature (0.0 - 1.0)
# 0.0 = deterministic, 1.0 = very creative
llm_temperature = 0.7

# Maximum tokens to generate from LLM
llm_max_tokens = 512

[Advanced]
# Retry Configuration for Cloud API calls
max_retries = 3
retry_delay_seconds = 5

# Enable metrics collection (for monitoring performance)
collect_metrics = false

# Path to save metrics (if enabled)
metrics_file = metrics.json

# Debug mode: prints all HTTP requests and responses
debug_mode = false
